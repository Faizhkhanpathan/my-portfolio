<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Logout | Faiz H Pathan</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body class="bg-dark text-white min-vh-100">

    <!-- Background Video -->
    <video autoplay muted loop playsinline class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover" style="z-index:-2;">

        <source src="landingpagevideo.mp4" type="video/mp4">

    </video>

    <!-- Dark Overlay -->
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75" style="z-index:-1;"></div>


    <!-- Home Button -->
    <a href="index.html" class="btn btn-outline-light position-absolute top-0 start-0 m-3">

        <i class="fa-solid fa-house me-2"></i>Home

    </a>


    <!-- Logout Section -->
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row justify-content-center w-100">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Animated Card -->
                <div id="logoutCard" class="card bg-dark bg-opacity-75 text-white border border-secondary rounded-4 shadow-lg">

                    <div class="card-body text-center p-4 p-md-5">

                        <!-- Animated Icon -->
                        <div class="mb-4">

                            <span id="logoutIcon" class="d-inline-flex align-items-center justify-content-center
                                       rounded-circle bg-success bg-opacity-25 text-success" style="width:100px;height:100px;">

                                <i class="fa-solid fa-circle-check display-3"></i>

                            </span>

                        </div>

                        <!-- Heading -->
                        <h1 class="h2 fw-bold mb-3">
                            Successfully <span class="text-info">Logged Out!</span>
                        </h1>

                        <!-- Message -->
                        <p class="text-white-50 fs-5 mb-4">
                            Thank you for visiting my portfolio. We hope to see you again soon!
                        </p>

                        <!-- Buttons -->
                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">

                            <a href="login.html" class="btn btn-info btn-lg fw-bold">

                                <i class="fa-solid fa-right-to-bracket me-2"></i> Login Again

                            </a>

                            <a href="index.html" class="btn btn-outline-light btn-lg fw-bold">

                                <i class="fa-solid fa-house me-2"></i> Go to Home

                            </a>

                        </div>

                        <!-- Social Links -->
                        <hr class="border-secondary my-4">

                        <p class="text-white-50 small mb-3">
                            Connect with me
                        </p>

                        <div class="d-flex justify-content-center gap-4">

                            <a href="https://github.com/Faizhkhanpathan" target="_blank" rel="noopener noreferrer" class="link-light fs-4" aria-label="GitHub">

                                <i class="fa-brands fa-github"></i>

                            </a>

                            <a href="https://www.linkedin.com/in/faiz-khan-pathan-0b47602a0/" target="_blank" rel="noopener noreferrer" class="link-light fs-4" aria-label="LinkedIn">

                                <i class="fa-brands fa-linkedin"></i>

                            </a>

                            <a href="mailto:pfaizkhan95@gmail.com" class="link-light fs-4" aria-label="Email">

                                <i class="fa-solid fa-envelope"></i>

                            </a>

                        </div>

                    </div>
                </div>

                <p class="text-center text-white-50 small mt-4 mb-0">
                    &copy; <span id="year"></span> Faiz H Pathan
                </p>

            </div>
        </div>
    </main>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Animations -->
    <script>
        const card = document.getElementById("logoutCard");
        const icon = document.getElementById("logoutIcon");

        // Card entrance animation
        card.animate(
            [{
                opacity: 0,
                transform: "translateY(35px) scale(0.96)"
            }, {
                opacity: 1,
                transform: "translateY(0) scale(1)"
            }], {
                duration: 850,
                easing: "ease-out",
                fill: "both"
            }
        );

        // Icon entrance animation
        icon.animate(
            [{
                opacity: 0,
                transform: "scale(0.5) rotate(-20deg)"
            }, {
                opacity: 1,
                transform: "scale(1.1) rotate(5deg)",
                offset: 0.7
            }, {
                opacity: 1,
                transform: "scale(1) rotate(0deg)"
            }], {
                duration: 900,
                easing: "ease-out",
                fill: "both"
            }
        );

        // Button hover animations
        document.querySelectorAll(".btn").forEach(button => {
            button.addEventListener("mouseenter", () => {
                button.animate(
                    [{
                        transform: "translateY(0)"
                    }, {
                        transform: "translateY(-3px)"
                    }], {
                        duration: 180,
                        fill: "forwards"
                    }
                );
            });

            button.addEventListener("mouseleave", () => {
                button.animate(
                    [{
                        transform: "translateY(-3px)"
                    }, {
                        transform: "translateY(0)"
                    }], {
                        duration: 180,
                        fill: "forwards"
                    }
                );
            });
        });

        // Automatic copyright year
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>

</html>
