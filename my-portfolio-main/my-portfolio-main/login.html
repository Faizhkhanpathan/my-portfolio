<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Faiz H Pathan</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-white min-vh-100 d-flex align-items-center justify-content-center p-3">

    <!-- LOGIN CONTAINER -->
    <main class="container">
        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card bg-secondary bg-opacity-25 border border-secondary rounded-4 shadow-lg">

                    <div class="card-body p-4 p-md-5 text-center">

                        <!-- Heading -->
                        <h1 class="h2 fw-bold text-info mb-4">
                            Welcome Back 👋
                        </h1>

                        <!-- LOGIN FORM -->
                        <form id="loginForm" class="d-flex flex-column gap-3">

                            <!-- Email -->
                            <div class="form-floating">
                                <input type="email" class="form-control bg-dark text-white border-secondary" id="email" placeholder="name@example.com" autocomplete="email" required>

                                <label for="email" class="text-secondary">
                  Email Address
                </label>
                            </div>

                            <!-- Password -->
                            <div class="form-floating">
                                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="Password" autocomplete="current-password" required>

                                <label for="password" class="text-secondary">
                  Password
                </label>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" id="loginSubmitBtn" class="btn btn-info btn-lg fw-bold mt-2">

                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Login

              </button>

                        </form>

                        <!-- OR DIVIDER -->
                        <div class="d-flex align-items-center gap-3 my-4">

                            <hr class="flex-grow-1 border-secondary">

                            <span class="text-white-50 fw-semibold">OR</span>

                            <hr class="flex-grow-1 border-secondary">

                        </div>

                        <!-- SOCIAL LOGIN -->
                        <div class="d-flex justify-content-center gap-4 mb-4">

                            <!-- Google -->
                            <button type="button" id="googleLoginBtn" class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;" aria-label="Login with Google">

                <i class="fa-brands fa-google fs-4"></i>

              </button>

                            <!-- GitHub -->
                            <button type="button" id="githubLoginBtn" class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;" aria-label="Login with GitHub">

                <i class="fa-brands fa-github fs-4"></i>

              </button>

                        </div>

                        <!-- SIGNUP AND PASSWORD LINKS -->
                        <div class="d-flex flex-column gap-3">

                            <p class="mb-0 text-white-50">
                                Don't have an account?

                                <a href="signup.html" class="link-warning fw-bold text-decoration-none">
                  Sign Up
                </a>
                            </p>

                            <a href="#" id="forgotPasswordLink" class="link-info text-decoration-none fw-semibold">
                Forgot Password?
              </a>

                        </div>

                        <!-- MESSAGE -->
                        <div id="authMessage" class="alert d-none mt-4 mb-0" role="alert" aria-live="polite">
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FIREBASE AUTHENTICATION -->
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, GithubAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // ✅ Firebase Config const firebaseConfig = { apiKey: "AIzaSyA6OaDz_zZec0RitJJya28T5PNobzZWy_g", authDomain: "myprotfolio-a70fe.firebaseapp.com", projectId: "myprotfolio-a70fe", storageBucket: "myprotfolio-a70fe.appspot.com", messagingSenderId:
        "578296764784", appId: "1:578296764784:web:d20ab5e59abe4986e8d7b5", measurementId: "G-FTFTPXXWF1" }; // Initialize Firebase const app = initializeApp(firebaseConfig); const auth = getAuth(app); // HTML Elements const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email"); const passwordInput = document.getElementById("password"); const loginSubmitBtn = document.getElementById("loginSubmitBtn"); const googleLoginBtn = document.getElementById("googleLoginBtn");
        const githubLoginBtn = document.getElementById("githubLoginBtn"); const forgotPasswordLink = document.getElementById("forgotPasswordLink"); const authMessage = document.getElementById("authMessage"); // Display success and error messages function
        showMessage(message, type = "danger") { authMessage.textContent = message; authMessage.className = `alert alert-${type} mt-4 mb-0`; } // EMAIL AND PASSWORD LOGIN loginForm.addEventListener("submit", async (event) => { event.preventDefault(); const
        email = emailInput.value.trim(); const password = passwordInput.value; loginSubmitBtn.disabled = true; loginSubmitBtn.innerHTML = '
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Logging in...'; try { await signInWithEmailAndPassword(auth, email, password); showMessage("Login successful! Redirecting...", "success"); window.location.href = "index.html";
        } catch (error) { showMessage(error.message); } finally { loginSubmitBtn.disabled = false; loginSubmitBtn.innerHTML = '
        <i class="fa-solid fa-right-to-bracket me-2"></i>Login'; } }); // GOOGLE LOGIN const googleProvider = new GoogleAuthProvider(); googleLoginBtn.addEventListener("click", async () => { googleLoginBtn.disabled = true; try { await signInWithPopup(auth,
        googleProvider); window.location.href = "index.html"; } catch (error) { showMessage("Google login failed: " + error.message); } finally { googleLoginBtn.disabled = false; } }); // GITHUB LOGIN const githubProvider = new GithubAuthProvider(); githubLoginBtn.addEventListener("click",
        async () => { githubLoginBtn.disabled = true; try { await signInWithPopup(auth, githubProvider); window.location.href = "index.html"; } catch (error) { showMessage("GitHub login failed: " + error.message); } finally { githubLoginBtn.disabled =
        false; } }); // FORGOT PASSWORD forgotPasswordLink.addEventListener("click", async (event) => { event.preventDefault(); const email = emailInput.value.trim(); if (!email) { showMessage( "Please enter your email address first.", "warning" ); emailInput.focus();
        return; } try { await sendPasswordResetEmail(auth, email); showMessage( "Password reset email sent. Please check your inbox.", "success" ); } catch (error) { showMessage("Unable to send reset email: " + error.message); } });

    </script>

</body>

</html>
