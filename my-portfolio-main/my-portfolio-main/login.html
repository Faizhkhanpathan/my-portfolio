<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Faiz H Pathan</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body class="bg-dark text-white min-vh-100">

    <!-- Background Video -->
    <video autoplay muted loop playsinline
        class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover"
        style="z-index:-2;">

        <source src="landingpagevideo.mp4" type="video/mp4">

    </video>

    <!-- Dark Overlay -->
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75"
         style="z-index:-1;"></div>


    <!-- Back to Home -->
    <a href="index.html"
       class="btn btn-outline-light position-absolute top-0 start-0 m-3">
        <i class="fa-solid fa-arrow-left me-2"></i>Home
    </a>


    <!-- Login Section -->
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row justify-content-center w-100">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <!-- Animated Card -->
                <div id="loginCard"
                    class="card bg-dark bg-opacity-75 text-white border border-secondary rounded-4 shadow-lg">

                    <div class="card-body p-4 p-md-5 text-center">

                        <!-- Logo -->
                        <div class="mb-3">
                            <span class="d-inline-flex align-items-center justify-content-center
                                         rounded-circle bg-info bg-opacity-25 text-info"
                                  style="width:75px;height:75px;">
                                <i class="fa-solid fa-user-lock fs-1"></i>
                            </span>
                        </div>

                        <h1 class="h2 fw-bold mb-2">
                            Welcome <span class="text-info">Back!</span>
                        </h1>

                        <p class="text-white-50 mb-4">
                            Login to your account and continue.
                        </p>


                        <!-- Login Form -->
                        <form id="loginForm" class="d-flex flex-column gap-3">

                            <div class="form-floating">
                                <input type="email"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="email"
                                    placeholder="name@example.com"
                                    autocomplete="email"
                                    required>

                                <label for="email" class="text-secondary">
                                    Email Address
                                </label>
                            </div>

                            <div class="form-floating">
                                <input type="password"
                                    class="form-control bg-dark text-white border-secondary"
                                    id="password"
                                    placeholder="Password"
                                    autocomplete="current-password"
                                    required>

                                <label for="password" class="text-secondary">
                                    Password
                                </label>
                            </div>

                            <div class="text-end">
                                <a href="#" id="forgotPasswordLink"
                                   class="link-info text-decoration-none small">
                                    Forgot Password?
                                </a>
                            </div>

                            <button type="submit" id="loginSubmitBtn"
                                class="btn btn-info btn-lg fw-bold shadow">

                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Login
                            </button>

                        </form>


                        <!-- Divider -->
                        <div class="d-flex align-items-center gap-3 my-4">
                            <hr class="flex-grow-1 border-secondary">
                            <span class="text-white-50">OR CONTINUE WITH</span>
                            <hr class="flex-grow-1 border-secondary">
                        </div>


                        <!-- Social Login -->
                        <div class="d-flex justify-content-center gap-3 mb-4">

                            <button type="button" id="googleLoginBtn"
                                class="btn btn-outline-light rounded-circle"
                                style="width:52px;height:52px;"
                                aria-label="Login with Google"
                                title="Google Login">

                                <i class="fa-brands fa-google fs-5"></i>
                            </button>

                            <button type="button" id="githubLoginBtn"
                                class="btn btn-outline-light rounded-circle"
                                style="width:52px;height:52px;"
                                aria-label="Login with GitHub"
                                title="GitHub Login">

                                <i class="fa-brands fa-github fs-5"></i>
                            </button>

                        </div>


                        <!-- Sign Up -->
                        <p class="text-white-50 mb-0">
                            Don't have an account?
                            <a href="signup.html"
                               class="link-info fw-bold text-decoration-none">
                                Sign Up
                            </a>
                        </p>


                        <!-- Messages -->
                        <div id="authMessage"
                             class="alert d-none mt-4 mb-0 text-start"
                             role="alert"
                             aria-live="polite">
                        </div>

                    </div>
                </div>

                <p class="text-center text-white-50 small mt-4">
                    <i class="fa-solid fa-shield-halved text-info me-1"></i>
                    Secure authentication powered by Firebase
                </p>

            </div>
        </div>
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Entrance Animation and Button Effects -->
    <script>
        const card = document.getElementById("loginCard");

        card.animate(
            [
                { opacity: 0, transform: "translateY(40px) scale(0.96)" },
                { opacity: 1, transform: "translateY(0) scale(1)" }
            ],
            {
                duration: 850,
                easing: "cubic-bezier(0.2, 0.8, 0.2, 1)",
                fill: "both"
            }
        );

        document.querySelectorAll(".btn").forEach(button => {
            button.addEventListener("mouseenter", () => {
                if (!button.disabled) {
                    button.animate(
                        [
                            { transform: "translateY(0)" },
                            { transform: "translateY(-3px)" }
                        ],
                        { duration: 180, fill: "forwards" }
                    );
                }
            });

            button.addEventListener("mouseleave", () => {
                button.animate(
                    [
                        { transform: "translateY(-3px)" },
                        { transform: "translateY(0)" }
                    ],
                    { duration: 180, fill: "forwards" }
                );
            });
        });
    </script>


    <!-- Firebase Authentication -->
    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            GithubAuthProvider,
            signInWithPopup,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA6OaDz_zZec0RitJJya28T5PNobzZWy_g",
            authDomain: "myprotfolio-a70fe.firebaseapp.com",
            projectId: "myprotfolio-a70fe",
            storageBucket: "myprotfolio-a70fe.firebasestorage.app",
            messagingSenderId: "578296764784",
            appId: "1:578296764784:web:d20ab5e59abe4986e8d7b5",
            measurementId: "G-FTFTPXXWF1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        // Elements
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginSubmitBtn = document.getElementById("loginSubmitBtn");
        const googleLoginBtn = document.getElementById("googleLoginBtn");
        const githubLoginBtn = document.getElementById("githubLoginBtn");
        const forgotPasswordLink = document.getElementById("forgotPasswordLink");
        const authMessage = document.getElementById("authMessage");


        // Show messages
        function showMessage(message, type = "danger") {
            authMessage.textContent = message;
            authMessage.className = `alert alert-${type} mt-4 mb-0 text-start`;
        }

        // Friendly Firebase errors
        function getErrorMessage(error) {
            const errors = {
                "auth/invalid-credential": "Incorrect email or password.",
                "auth/invalid-email": "Please enter a valid email address.",
                "auth/user-not-found": "No account found for this email.",
                "auth/wrong-password": "Incorrect password.",
                "auth/popup-closed-by-user": "Login popup was closed.",
                "auth/popup-blocked": "Allow popups and try again.",
                "auth/unauthorized-domain": "This domain is not authorized in Firebase.",
                "auth/operation-not-allowed": "Enable this login provider in Firebase Console.",
                "auth/too-many-requests": "Too many attempts. Please try again later."
            };

            return errors[error.code] || "Authentication failed. Please try again.";
        }


        // Email and Password Login
        loginForm.addEventListener("submit", async event => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);

                showMessage("Login successful! Redirecting...", "success");

                window.location.href = "index.html";

            } catch (error) {
                showMessage(getErrorMessage(error));
            } finally {
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket me-2"></i>Login';
            }
        });


        // Google Login
        googleLoginBtn.addEventListener("click", async () => {
            googleLoginBtn.disabled = true;

            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
                window.location.href = "index.html";

            } catch (error) {
                showMessage("Google login: " + getErrorMessage(error));
            } finally {
                googleLoginBtn.disabled = false;
            }
        });


        // GitHub Login
        githubLoginBtn.addEventListener("click", async () => {
            githubLoginBtn.disabled = true;

            try {
                await signInWithPopup(auth, new GithubAuthProvider());
                window.location.href = "index.html";

            } catch (error) {
                showMessage("GitHub login: " + getErrorMessage(error));
            } finally {
                githubLoginBtn.disabled = false;
            }
        });


        // Forgot Password
        forgotPasswordLink.addEventListener("click", async event => {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showMessage("Enter your email address first.", "warning");
                emailInput.focus();
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);

                showMessage(
                    "Password reset email sent. Please check your inbox.",
                    "success"
                );

            } catch (error) {
                showMessage(getErrorMessage(error));
            }
        });

    </script>

</body>
</html>
